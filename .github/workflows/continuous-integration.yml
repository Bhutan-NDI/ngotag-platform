name: Continuous Integration

# Two tiers, because this repository has had no checks at all and everything fails today.
#
#   GATING  -- formatting and linting, but only on the .ts files a PR actually changes. New code
#              has to be clean. This blocks the merge, and it is the point of the workflow: the
#              existing debt stops growing from today.
#
#   REPORT  -- compilation and the full test run, over the whole repo. These cannot gate yet, so
#              they are continue-on-error and their real outcome goes to the run summary.
#
# A check that is green while the repository is broken teaches people to ignore it, so nothing
# here is green unless it means something. Measured on develop:
#
#   prettier --check   209 files with style issues
#   eslint             325 problems, 249 of them errors
#   tsc --noEmit       36 errors, mostly in *.spec.ts
#   jest               5 failing tests of 136, and 19 of 52 suites failing to run at all
#
# Those numbers are the backlog and clearing them is separate work -- dead spec files importing
# modules that no longer exist, two missing dependencies, and jest resolution gaps. As each
# reported check reaches zero on develop, move it up into the gating tier.
#
# The package scripts are not usable here: `lint` runs eslint with --fix and `format` runs
# prettier with --write, both of which mutate the tree. The non-mutating equivalents are used
# directly instead.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: platform-ci-${{ github.ref }}-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Belt and braces alongside --ignore-scripts, matching the Dockerfiles.
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PHANTOMJS_SKIP_DOWNLOAD: 'true'

jobs:
  validate:
    runs-on: ubuntu-24.04
    name: Validate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed to diff against the base branch for the changed-files gate.
          fetch-depth: 0

      # No version pin here on purpose: package.json's `packageManager` field already sets it,
      # and specifying both makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # --ignore-scripts matches every Dockerfile in this repo, and it is not optional here: the
      # postinstall scripts fetch PhantomJS and three Chrome builds, which took longer than the
      # rest of the job put together. Prisma's client is the only postinstall output anything
      # here needs, and it is generated explicitly below.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Not `pnpm prisma:generate`: that script is `npx prisma generate` with no schema path and
      # no prisma.schema entry in package.json, so it only resolves from inside
      # libs/prisma-service, which is where the Dockerfiles run it.
      - name: Generate Prisma client
        id: prisma
        continue-on-error: true
        run: pnpm exec prisma generate --schema libs/prisma-service/prisma/schema.prisma

      # ---------- gating tier: only what this PR changed ----------

      - name: Collect changed TypeScript files
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          FILES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.ts' | tr '\n' ' ')
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"
          if [ -z "${FILES}" ]; then
            echo "No TypeScript files changed; the gating checks are skipped."
          else
            echo "Gating on: ${FILES}"
          fi

      - name: Formatting (changed files)
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        run: pnpm exec prettier --check ${{ steps.changed.outputs.files }}

      - name: Linting (changed files)
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        run: pnpm exec eslint ${{ steps.changed.outputs.files }}

      # ---------- reporting tier: whole repo, cannot gate yet ----------

      - name: Formatting (whole repo)
        id: format
        continue-on-error: true
        run: pnpm exec prettier --check "apps/**/*.ts" "libs/**/*.ts"

      - name: Linting (whole repo)
        id: lint
        continue-on-error: true
        run: pnpm exec eslint "{apps,libs}/**/*.ts"

      - name: Compile
        id: compile
        continue-on-error: true
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm exec jest --ci

      - name: Summary
        if: always()
        run: |
          {
            echo "## Validate"
            echo ""
            echo "**Gating** -- these block the merge, and cover only the files this PR changed."
            echo "If the job failed, it failed on one of these and the fix is in your diff."
            echo ""
            echo "| Gate | Scope |"
            echo "| --- | --- |"
            echo "| Formatting | changed .ts files |"
            echo "| Linting | changed .ts files |"
            echo ""
            echo "**Reported** -- whole repo, non-blocking. A failure here is almost certainly"
            echo "pre-existing; the baseline is recorded at the top of the workflow file."
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Prisma client | ${{ steps.prisma.outcome }} |"
            echo "| Formatting (whole repo) | ${{ steps.format.outcome }} |"
            echo "| Linting (whole repo) | ${{ steps.lint.outcome }} |"
            echo "| Compile | ${{ steps.compile.outcome }} |"
            echo "| Test | ${{ steps.test.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
